[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-flow-annotator"
version = "1.0.0"
description = "Local English speech-flow annotation web application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "imageio-ffmpeg>=0.6,<1",
  "pydantic>=2.10,<3",
  "click>=8.1,<8.5",
  "cmudict>=1.1,<2",
  "edge-tts>=7.2.8,<8",
  "argon2-cffi>=25.1,<26",
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.21,<1",
  "ctranslate2>=4.6,<4.7",
]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/blossoms6/speech-flow-annotator"
Issues = "https://github.com/blossoms6/speech-flow-annotator/issues"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
